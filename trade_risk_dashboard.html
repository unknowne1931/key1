
<html>
<head>
    <title>📊 Trade Risk Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px; }
        h2 { text-align: center; color: #222; }
        .data-table {
            width: 60%; margin: auto;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        .data-table th {
            background-color: #444;
            color: white;
        }
        .data-table tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>🛢️ Crude Oil Trade Risk Report</h2>
    <table class="dataframe data-table">
  <thead>
    <tr style="text-align: center;">
      <th>Entry Price (USD)</th>
      <th>Target (+10%)</th>
      <th>Stop Loss (-10%)</th>
      <th>Risk‑Reward Ratio</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>74.04</td>
      <td>81.44</td>
      <td>66.64</td>
      <td>1.00</td>
    </tr>
  </tbody>
</table>
</body>
</html>
