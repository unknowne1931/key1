<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POST JSON Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    #response {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #eef;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Send JSON POST Request</h2>
    <label for="questionId">Conceptual Question ID:</label>
    <input type="text" id="questionId" value="0dc74b52-e1fe-4d50-949d-fa2a06d34557">
    <button onclick="sendPostRequest()">Send Request</button>

    <div id="response"></div>
  </div>

  <script>
    function sendPostRequest() {
      const id = document.getElementById("questionId").value;
      const bodyData = {
        conceptualQuestionId: id
      };

      fetch("https://acciojob-backend-eobnd7jx2q-el.a.run.app/aptitude/get-aptitude-question-detail", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(bodyData)
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("response").textContent = JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById("response").textContent = "Error: " + error;
      });
    }
  </script>
</body>
</html>
