<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCQ: Find Common Numbers in All Sets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      text-align: center;
      padding: 30px;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }
    .box {
      border: 2px solid #444;
      border-radius: 10px;
      width: 160px;
      padding: 12px;
      background-color: #fff;
    }
    .box h3 {
      margin-top: 0;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #f15a24;
      color: white;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .result {
      font-size: 18px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>🧠 MCQ: Which number is common to all 3 sets?</h2>

<div class="container">
  <div class="box">
    <h3>Set A</h3>
    <div id="aValues">1, 2, 3, 5, 9</div>
  </div>
  <div class="box">
    <h3>Set B</h3>
    <div id="bValues">2, 3, 6, 7, 9</div>
  </div>
  <div class="box">
    <h3>Set C</h3>
    <div id="cValues">3, 4, 5, 6, 9</div>
  </div>
</div>

<div id="mcq-options">
  <button onclick="checkAnswer(this)">3</button>
  <button onclick="checkAnswer(this)">5</button>
  <button onclick="checkAnswer(this)">9</button>
  <button onclick="checkAnswer(this)">2</button>
</div>

<div class="result" id="resultBox"></div>

<script>
  // Correct answers: 3 and 9 are common to all sets
  const correctAnswers = ["3", "9"];

  function checkAnswer(btn) {
    const selected = btn.innerText;
    const resultBox = document.getElementById("resultBox");

    if (correctAnswers.includes(selected)) {
      btn.style.backgroundColor = "green";
      resultBox.innerHTML = `✅ Correct! ${selected} is common to all 3 sets.`;
    } else {
      btn.style.backgroundColor = "darkred";
      resultBox.innerHTML = `❌ Incorrect. ${selected} is not common to all 3 sets.`;
    }
  }
</script>

</body>
</html>
