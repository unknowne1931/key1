<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OMR Center-Digit Challenge</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #e0eafc, #cfdef3);
      padding: 30px 10px;
      text-align: center;
      min-height: 100vh;
    }

    h2 {
      margin-bottom: 30px;
      font-size: 26px;
      color: #2b2d42;
    }

    .omr-container {
      display: flex;
      gap: 1px;
      justify-content: center;
      border: 1px solid;
      flex-wrap: wrap;
      width: 400px;
      margin-bottom: 40px;
      margin: auto;
      padding: 10px;
    }

    .digit-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .digit-label {
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #555;
    }

    .bubble {
      width: 20px;
      height: 20px;
      border: 1px solid #aaa;
      border-radius: 50%;
      margin: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #555;
      transition: 0.3s;
      background: #fff;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
    }

    .filled {
      background: #282c34;
      color:#282c34 ;
      font-weight: bold;
      box-shadow: 0 0 6px #ff00ccaa, 0 0 10px #333 inset;
      border: 2px solid #63014f;
    }

    .options {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .option-btn {
      padding: 14px 20px;
      font-size: 17px;
      cursor: pointer;
      border: none;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: 0.2s;
      backdrop-filter: blur(8px);
    }

    .option-btn:hover {
      background-color: #ddeeff;
    }

    .correct {
      background-color: #28a745 !important;
      color: white !important;
      font-weight: bold;
    }

    .wrong {
      background-color: #dc3545 !important;
      color: white !important;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .bubble { width: 20px; height: 20px; font-size: 10px; }
      .option-btn { font-size: 15px; }
    }

    .submit_btn {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #previewContainer img {
      margin-top: 20px;
      max-width: 100%;
      height: auto;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

<h2>🎯 OMR Challenge – Spot the Center Difference</h2>
<div class="omr-container" id="omr-container"></div>

<h3>Select the correct number based on the OMR bubbles:</h3>
<div class="options" id="options-container"></div>

<button id="btnCapture" class="submit_btn">📸 Capture Screenshot</button>
<button id="btnUpload" class="submit_btn" disabled>🚀 Upload Screenshot</button>

<div id="previewContainer"></div>

<script>
  let capturedBlob = null;
  let optionsArray = [];
  let correctAnswer = "";
  let currentQuestion = "";

  function generateRandomNumber() {
    return Math.floor(1000000000 + Math.random() * 8999999999).toString();
  }

  function generateCenterChallengeOptions(correct) {
    const options = [{ value: correct }];
    const used = new Set([correct]);
    const centerIndexes = [4, 5]; // 0-based index

    while (options.length < 4) {
      let arr = correct.split('');
      let i = centerIndexes[Math.floor(Math.random() * centerIndexes.length)];
      let original = arr[i];
      let newDigit = (parseInt(original) + 1 + Math.floor(Math.random() * 8)) % 10;
      if (newDigit === parseInt(original)) continue;
      arr[i] = newDigit.toString();
      let newStr = arr.join('');
      if (!used.has(newStr)) {
        used.add(newStr);
        options.push({ value: newStr });
      }
    }

    return options.sort(() => Math.random() - 0.5);
  }

  function buildOMR(number) {
    const container = document.getElementById("omr-container");
    container.innerHTML = "";
    number.split("").forEach((digit, index) => {
      const column = document.createElement("div");
      column.className = "digit-column";
      const label = document.createElement("div");
      label.className = "digit-label";
      column.appendChild(label);
      for (let i = 0; i <= 9; i++) {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = i;
        if (parseInt(digit) === i) {
          bubble.classList.add("filled");
        }
        column.appendChild(bubble);
      }
      container.appendChild(column);
    });
  }

  function buildOptions(correct, options) {
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt.value;
      btn.onclick = () => {
        if (opt.value === correct) {
          btn.classList.add("correct");
          alert("✅ Correct!");
        } else {
          btn.classList.add("wrong");
          alert("❌ Wrong!");
        }
      };
      optionsContainer.appendChild(btn);
    });
  }

  function post(imagePath) {
    fetch("http://192.168.31.44/api/question", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: "What is the number shown in the OMR sheet?",
        answer: correctAnswer,
        a: optionsArray[0] || "",
        b: optionsArray[1] || "",
        c: optionsArray[2] || "",
        d: optionsArray[3] || "",
        language: "English",
        category: "OMR Challenge",
        difficulty: "Medium",
        type: "Mental Ability",
        image: `https://backend.stawro.com/stawro/${imagePath}`,
        seconds: "10"
      })
    })
    .then(res => res.json())
    .then(data => {
      alert("✅ Question posted successfully!");
      location.reload();
    })
    .catch(err => {
      console.error("❌ POST Error:", err);
      alert("❌ Failed to post question.");
    });
  }

  document.getElementById("btnCapture").addEventListener("click", () => {
    const element = document.querySelector(".omr-container");
    html2canvas(element).then(canvas => {
      canvas.toBlob(blob => {
        capturedBlob = blob;
        const url = URL.createObjectURL(blob);
        document.getElementById("previewContainer").innerHTML = `<img src="${url}" alt="OMR Preview">`;
        document.getElementById("btnUpload").disabled = false;
      }, 'image/png');
    });
  });

  document.getElementById("btnUpload").addEventListener("click", () => {
    if (!capturedBlob) return alert("❌ No screenshot captured!");
    const formData = new FormData();
    formData.append("screenshot", capturedBlob, "omr.png");

    fetch("https://backend.stawro.com/stawro/upload.php", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        post(res.path);
      } else {
        alert("⚠️ Upload failed.");
      }
    })
    .catch(err => {
      console.error("❌ Upload Error:", err);
      alert("❌ Upload error.");
    });
  });

  // INITIALIZE QUIZ
  const correctNumber = generateRandomNumber();
  correctAnswer = correctNumber;
  const optionList = generateCenterChallengeOptions(correctNumber);
  optionsArray = optionList.map(o => o.value);
  buildOMR(correctNumber);
  buildOptions(correctNumber, optionList);
</script>

</body>
</html>
