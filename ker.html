<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Venn Diagram Sets in Fixed Box</title>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      padding: 30px;
      text-align: center;
    }

    h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
    }

    .main-box.ss_cnt {
      width: 400px;
      height: 250px;
      margin: 0 auto 20px;
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .set-box {
      width: 90%;
      padding: 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      text-align: center;
    }

    .set-box.a { background-color: #f99b82; }
    .set-box.b { background-color: #7dc9ff; }
    .set-box.c { background-color: #8ee095; }

    .options button {
      margin: 10px 8px;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .options button:hover {
      background-color: #1e3a8a;
    }

    .result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      color: #333;
    }
  </style>
</head>
<body>

<h2>Which numbers are common to all 3 sets?</h2>

<div class="main-box ss_cnt">
  <div class="set-box a" id="aValues">Set A: </div>
  <div class="set-box b" id="bValues">Set B: </div>
  <div class="set-box c" id="cValues">Set C: </div>
</div>

<div class="options" id="mcq-options"></div>
<div class="result" id="resultBox"></div>
<br/>

<select id="difficultySelect">
  <option value="Too Easy">Too Easy</option>
  <option value="Easy">Easy</option>
  <option value="Medium" selected>Medium</option>
  <option value="Tough">Tough</option>
  <option value="Too Tough">Too Tough</option>
</select>
<br><br>
<button id="btnCapture">📸 Capture Screenshot</button>
<button id="btnUpload" disabled>⬆️ Upload</button>
<div id="previewContainer"></div>

<script>
  let capturedBlob = null;

  const base = Array.from({ length: 50 }, (_, i) => i + 1);
  const common = getRandomUnique(base, 6);
  const used = new Set(common);

  const setA = [...common, ...getRandomUnique(base.filter(n => !used.has(n)), 4)];
  const setB = [...common, ...getRandomUnique(base.filter(n => !used.has(n)), 4)];
  const setC = [...common, ...getRandomUnique(base.filter(n => !used.has(n)), 4)];

  document.getElementById("aValues").innerText = "Set A: " + shuffleArray(setA).join(", ");
  document.getElementById("bValues").innerText = "Set B: " + shuffleArray(setB).join(", ");
  document.getElementById("cValues").innerText = "Set C: " + shuffleArray(setC).join(", ");

  const correctOption = getRandomSample(common, 4);
  const wrongOptions = [];

  while (wrongOptions.length < 3) {
    const wrong = [...getRandomSample(common, 2), getRandomExtra(), getRandomExtra()];
    if (!arraysEqual(wrong, correctOption)) wrongOptions.push(wrong);
  }

  const options = shuffleArray([correctOption, ...wrongOptions]);
  const container = document.getElementById("mcq-options");

  options.forEach((group) => {
    const btn = document.createElement("button");
    btn.innerText = group.join(", ");
    btn.onclick = () => check(group, btn);
    container.appendChild(btn);
  });

  function check(group, btn) {
    const allCommon = group.every(n => setA.includes(n) && setB.includes(n) && setC.includes(n));
    if (allCommon) {
      btn.style.backgroundColor = "green";
      document.getElementById("resultBox").innerText = `✅ Correct! ${group.join(", ")} are common to all.`;
    } else {
      btn.style.backgroundColor = "darkred";
      document.getElementById("resultBox").innerText = `❌ Incorrect. Not all are common.`;
    }
  }

  function getRandomUnique(array, count) {
    const shuffled = [...array].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, count);
  }

  function getRandomSample(array, count) {
    return getRandomUnique(array, count);
  }

  function getRandomExtra() {
    return Math.floor(Math.random() * 100) + 51;
  }

  function shuffleArray(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function arraysEqual(a, b) {
    return a.length === b.length && a.every((v, i) => v === b[i]);
  }

  document.getElementById("btnCapture").addEventListener("click", function () {
    const element = document.querySelector(".ss_cnt");
    html2canvas(element).then(canvas => {
      canvas.toBlob(blob => {
        capturedBlob = blob;
        const url = URL.createObjectURL(blob);
        document.getElementById("previewContainer").innerHTML = `<img src="${url}" alt="Preview">`;
        document.getElementById("btnUpload").disabled = false;
      }, 'image/webp');
    });
  });

  document.getElementById("btnUpload").addEventListener("click", function () {
    if (!capturedBlob) return alert("No screenshot captured!");

    const formData = new FormData();
    formData.append("screenshot", capturedBlob, "screenshot.webp");

    fetch("https://backend.stawro.com/stawro/upload.php", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(res => {
      if (res.status && res.path) {
        const fullImagePath = `https://backend.stawro.com/stawro/${res.path}`;
        alert("✅ Upload successful!");
        postQuestion(fullImagePath);
      } else {
        alert("❌ Upload failed.");
      }
    })
    .catch(err => {
      console.error("Upload error:", err);
      alert("❌ Upload error.");
    });
  });

  function postQuestion(imagePath) {
    const difficulty = document.getElementById("difficultySelect").value || "Medium";
    const correctStr = correctOption.join(", ");
    const opts = options.map(opt => opt.join(", "));

    fetch("http://localhost/api/question", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: "Spot the numbers that exist in every set!",
        answer: correctStr,
        a: opts[0],
        b: opts[1],
        c: opts[2],
        d: opts[3],
        language: "English",
        category: "Set_Theory",
        difficulty: difficulty,
        type: "Mental Ability",
        image: imagePath,
        seconds: "10"
      })
    })
    .then(res => res.json())
    .then(data => {
      alert("✅ Question posted to database!");
    })
    .catch(error => {
      console.error("❌ Error posting question:", error);
      alert("❌ Error posting question.");
    });
  }
</script>

</body>
</html>
