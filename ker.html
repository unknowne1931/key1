<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Match the Quiz</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f4f7;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .quiz-container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .clue-box {
      width: 400px;
      height: 250px;
      margin: 0 auto 25px auto;
      border: 2px dashed #0077aa;
      background-color: #f9fdff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .clue-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .item {
      font-size: 18px;
    }
    .option {
      background: #e0f7fa;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .option:hover {
      background: #b2ebf2;
    }
    .correct {
      background: #c8e6c9 !important;
    }
    .wrong {
      background: #ffcdd2 !important;
    }
    .answers {
      margin-top: 25px;
      background: #eef6ff;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #a1c4e6;
      display: none;
      font-size: 16px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="clue-box">
    <div class="clue-inner" id="question"></div>
  </div>
  <div id="options"></div>
  <div class="answers" id="answers"></div>
</div>

<script>
const data = {
  "Eyes": "2",
  "Hands": "2",
  "Fingers": "10",
  "Car": "4 wheels",
  "Bike": "2 wheels",
  "Toes": "10",
  "Days in a week": "7",
  "Months in a year": "12",
  "Alphabets": "26",
  "Seconds in a minute": "60",
  "Legs on a spider": "8",
  "Corners of a square": "4",
  "Planets in solar system": "8",
  "Clock hands": "3",
  "Binary digits": "2",
  "Teeth in adult": "32",
  "States in India": "28",
  "Continents": "7",
  "Oceans": "5",
  "Primary colors": "3"
};

// Select 3 random items
let keys = Object.keys(data);
let selected = [];
while (selected.length < 3) {
  const item = keys[Math.floor(Math.random() * keys.length)];
  if (!selected.includes(item)) selected.push(item);
}

// Clues
let correctAnswers = [];
let clueHTML = '';
selected.forEach((item) => {
  clueHTML += `<div class="item">${item} : ?</div>`;
  correctAnswers.push(data[item]);
});
document.getElementById("question").innerHTML = clueHTML;

// Options (1 correct + 3 random wrong)
let options = [correctAnswers];
while (options.length < 4) {
  let fake = [];
  for (let i = 0; i < 3; i++) {
    const randVal = Object.values(data)[Math.floor(Math.random() * Object.values(data).length)];
    fake.push(randVal);
  }
  if (!options.some(o => JSON.stringify(o) === JSON.stringify(fake))) {
    options.push(fake);
  }
}
options = options.sort(() => Math.random() - 0.5);
const correctIndex = options.findIndex(o => JSON.stringify(o) === JSON.stringify(correctAnswers));

// Show options
const optionsDiv = document.getElementById("options");
options.forEach((opt, idx) => {
  const div = document.createElement("div");
  div.className = "option";
  div.innerText = `${String.fromCharCode(65 + idx)}) ${opt[0]}, ${opt[1]}, ${opt[2]}`;
  div.onclick = () => {
    document.querySelectorAll(".option").forEach(el => el.onclick = null);
    if (idx === correctIndex) {
      div.classList.add("correct");
    } else {
      div.classList.add("wrong");
      document.querySelectorAll(".option")[correctIndex].classList.add("correct");
    }

    // Show the correct answers
    const ansDiv = document.getElementById("answers");
    ansDiv.style.display = "block";
    ansDiv.innerHTML = `<strong>Correct Answers:</strong><br>
      ${selected[0]} → ${correctAnswers[0]}<br>
      ${selected[1]} → ${correctAnswers[1]}<br>
      ${selected[2]} → ${correctAnswers[2]}`;
  };
  optionsDiv.appendChild(div);
});
</script>

</body>
</html>
